[versions]
kotlin = "2.4.21"
androidKmp = "9.4.1"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
ktlintEngine = "1.8.0"
kotlinxBenchmark = "0.5.0"
androidxTestRunner = "1.7.0"
awsCredentialTypes = "0.1.1"
bytes = "0.2.2"
digest = "0.1.0"
hmac = "0.1.3"
http = "0.2.1"
p256 = "0.1.0"
prettyAssertions = "0.1.0"
serde = "0.1.11"
serdeJson = "0.1.1"
sha2 = "0.1.0"
time = "0.2.1"
tracing = "0.1.0"
zeroize = "0.1.1"

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
aws-credential-types-kotlin = { module = "io.github.kotlinmania:aws-credential-types-kotlin", version.ref = "awsCredentialTypes" }
bytes-kotlin = { module = "io.github.kotlinmania:bytes-kotlin", version.ref = "bytes" }
digest-kotlin = { module = "io.github.kotlinmania:digest-kotlin", version.ref = "digest" }
hmac-kotlin = { module = "io.github.kotlinmania:hmac-kotlin", version.ref = "hmac" }
http-kotlin = { module = "io.github.kotlinmania:http-kotlin", version.ref = "http" }
p256-kotlin = { module = "io.github.kotlinmania:p256-kotlin", version.ref = "p256" }
pretty-assertions-kotlin = { module = "io.github.kotlinmania:pretty-assertions-kotlin", version.ref = "prettyAssertions" }
serde-kotlin = { module = "io.github.kotlinmania:serde-kotlin", version.ref = "serde" }
serde-json-kotlin = { module = "io.github.kotlinmania:serde-json-kotlin", version.ref = "serdeJson" }
sha2-kotlin = { module = "io.github.kotlinmania:sha2-kotlin", version.ref = "sha2" }
time-kotlin = { module = "io.github.kotlinmania:time-kotlin", version.ref = "time" }
tracing-kotlin = { module = "io.github.kotlinmania:tracing-kotlin", version.ref = "tracing" }
zeroize-kotlin = { module = "io.github.kotlinmania:zeroize-kotlin", version.ref = "zeroize" }

[bundles]
aws-sigv4-commonMainApi = [
  "aws-credential-types-kotlin",
]
aws-sigv4-commonMain = [
  "bytes-kotlin",
  "digest-kotlin",
  "hmac-kotlin",
  "http-kotlin",
  "p256-kotlin",
  "serde-kotlin",
  "sha2-kotlin",
  "time-kotlin",
  "tracing-kotlin",
  "zeroize-kotlin",
]
aws-sigv4-commonTest = [
  "pretty-assertions-kotlin",
  "serde-kotlin",
  "serde-json-kotlin",
]
